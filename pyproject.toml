[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "HTTP service monitoring with FastAPI and Prometheus metrics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "prometheus-client>=0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opspilot*"]
